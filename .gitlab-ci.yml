image: node:24

stages:
  - verify

verify:
  stage: verify
  variables:
    npm_config_store_dir: .pnpm-store
  before_script:
    - npm install -g pnpm@10.32.1
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm build
    - pnpm test
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  artifacts:
    when: always
    paths:
      - coverage/
